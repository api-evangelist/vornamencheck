aid: vornamencheck
name: Vornamencheck
description: Vornamencheck provides a REST API that determines the gender probability of a given first name based on the specified country. The
  service returns a likelihood for male or female, helping businesses clean and personalize data, suggest appropriate salutations, and automate
  gender-based workflows. It supports multiple languages and countries, offering a simple HTTP GET endpoint for integration into forms, databases,
  and applications.
